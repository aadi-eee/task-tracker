<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker | Aaditi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #fbf1e6; color: #2a1b1b; font-family: "Instrument Serif", Georgia, serif; font-size: 20px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-weight: 400; font-size: 52px; color: #6b0f1a; text-align: center; margin: 0 0 28px; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; font: inherit; padding: 10px 14px; border: 2px solid #2a1b1b; border-radius: 999px; background: #fff; }
    button { font: inherit; padding: 8px 18px; border: 2px solid #6b0f1a; border-radius: 999px; background: #6b0f1a; color: #fff; cursor: pointer; }
    button:hover { background: #fff; color: #6b0f1a; }
    .filters { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .filters button.active { background: #fff; color: #6b0f1a; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid #2a1b1b; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 4px 4px 0 #f4a6c4; }
    li.done span { text-decoration: line-through; opacity: 0.6; }
    li span { flex: 1; }
    li input[type="checkbox"] { width: 20px; height: 20px; accent-color: #6b0f1a; }
    .del { background: transparent; color: #6b0f1a; border-color: #6b0f1a; padding: 4px 12px; }
    .del:hover { background: #6b0f1a; color: #fff; }
    .count { text-align: center; opacity: 0.7; margin-top: 16px; font-size: 17px; }
    .empty { text-align: center; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Task <span style="font-family:'Pinyon Script',cursive;font-style:italic;color:#f4a6c4;">tracker</span></h1>

    <form id="form">
      <input id="input" type="text" placeholder="Add a task..." aria-label="New task">
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">To do</button>
      <button type="button" data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
    <p class="count" id="count"></p>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
    let filter = "all";
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      render();
    }

    function render() {
      const visible = tasks.filter((t) =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      list.innerHTML = "";
      if (visible.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = tasks.length === 0 ? "No tasks yet. Add one above." : "Nothing here.";
        list.before(empty);
        empty.id = "empty";
      }
      document.getElementById("empty")?.remove();
      if (visible.length === 0) {
        const p = document.createElement("p");
        p.id = "empty";
        p.className = "empty";
        p.textContent = tasks.length === 0 ? "No tasks yet. Add one above." : "Nothing here.";
        list.after(p);
      }

      visible.forEach((task) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = task.done;
        box.addEventListener("change", () => {
          task.done = box.checked;
          save();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "Delete";
        del.addEventListener("click", () => {
          tasks = tasks.filter((t) => t.id !== task.id);
          save();
        });

        li.append(box, text, del);
        list.appendChild(li);
      });

      const left = tasks.filter((t) => !t.done).length;
      count.textContent = left + " of " + tasks.length + " left to do";
    }

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text, done: false });
      input.value = "";
      save();
    });

    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filters button").forEach((b) => b.classList.remove("active"));
        button.classList.add("active");
        filter = button.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
